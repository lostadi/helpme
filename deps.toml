# helpme runtime dependencies
# Ostadix-lang is required — every .O program runs on its `O` binary.

[dependencies.ostadix-lang]
name = "Ostadix-lang"
git = "https://github.com/lostadi/Ostadix-lang.git"
path = "Ostadix-lang"
required = true
role = "Runtime for .O programs (binary `O` + backends/)"
build = "cargo build --release --manifest-path=Ostadix-lang/Cargo.toml"
binary = "Ostadix-lang/target/release/O"
backends = "Ostadix-lang/backends"

[dependencies.python3]
required = true
role = "Ostadix Python backend used by most .O programs"

[dependencies.sqlite3]
required = true
role = "Local command index database"

[dependencies.rust]
required = true
role = "Toolchain to build Ostadix-lang (cargo / rustc)"
url = "https://rustup.rs"

# Installed/upgraded per-OS by: helpme setup
[optional]
fzf = "Fuzzy TUI"
man = "Manual pages (mandoc/man-db depending on OS)"
tldr = "Community examples (tealdeer/tldr)"
bat = "Syntax-highlighted lookup"
info = "GNU info (texinfo)"
