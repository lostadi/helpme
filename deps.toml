# helpme runtime dependencies
# OSTADIX is required — every .O program runs on its `O` binary.

[dependencies.ostadix]
name = "OSTADIX"
git = "https://github.com/lostadi/OSTADIX.git"
path = "OSTADIX"
required = true
role = "Runtime for .O programs (binary `O` + backends/)"
build = "cargo build --release --manifest-path=OSTADIX/Cargo.toml"
binary = "OSTADIX/target/release/O"
backends = "OSTADIX/backends"

[dependencies.python3]
required = true
role = "OSTADIX Python backend used by most .O programs"

[dependencies.sqlite3]
required = true
role = "Local command index database"

[dependencies.rust]
required = true
role = "Toolchain to build OSTADIX (cargo / rustc)"
url = "https://rustup.rs"

# Installed/upgraded per-OS by: helpme setup
[optional]
fzf = "Fuzzy TUI"
man = "Manual pages (mandoc/man-db depending on OS)"
tldr = "Community examples (tealdeer/tldr)"
bat = "Syntax-highlighted lookup"
info = "GNU info (texinfo)"
